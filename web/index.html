<head>

<script>
/* 构建版本自检：服务端版本变化时旧页面自动强刷一次（sessionStorage 防循环） */
window.__BUILD = '20261110t';
(function () {
  try {
    var K = '__build_seen';
    if (sessionStorage.getItem(K) === window.__BUILD) return;
    fetch('/?_buildchk=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      var m = t.match(/__BUILD = '([^']+)'/) || t.match(/__BUILD='([^']+)'/);
      if (m && m[1] && m[1] !== window.__BUILD) {
        try { sessionStorage.setItem(K, m[1]); } catch (e) { }
        location.reload();
      }
    }).catch(function () { });
  } catch (e) { }
})();
</script>
</head>

      <path d="M75 30 v32 M52 46 h46" stroke="rgba(255,255,255,.34)" stroke-width="2.4" fill="none"/>
    </g>
    <circle class="head" cx="68" cy="92" r="14"/>
    <path d="M56 84 q12 -12 24 0" fill="#3d7bff"/>
    <circle cx="63" cy="93" r="2.2" fill="#2b2118"/>
    <circle cx="74" cy="93" r="2.2" fill="#2b2118"/>
    <path d="M64 99 q5 4 10 0" stroke="#2b2118" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path class="body" d="M56 104 h24 a4 4 0 0 1 4 4 v26 a4 4 0 0 1 -4 4 h-24 a4 4 0 0 1 -4 -4 v-26 a4 4 0 0 1 4 -4z"/>

</div>

<header class="topbar">
  <div class="logo">oqt<b>·quant</b></div>
  <nav>    <a href="/web/index.html" class="on">总览</a>
  </nav>
  <div class="env"><span id="clock" class="num"></span></div>
</header>

<div class="wrap">

  <!-- 实时行情监控：主流币名称 + 价格 + 1D 涨跌幅（涨红跌绿） -->
  <div class="live-bar">
    <span class="live-dot"></span>
    <b>实时行情监控</b>
    <span class="live-sep"></span>
    <span id="lb-majors" class="lb-majors"><span class="muted">加载中…</span></span>
    <span class="live-sep"></span>
    <span class="live-lab">全市场</span><b id="lb-okx">-</b>
    <span class="live-sep"></span>
    <span class="live-lab">情绪</span><b id="lb-mood">-</b>
    <span class="live-sep"></span>
    <span class="live-lab" id="lb-ws">WS 连接中</span>
    <span style="margin-left:auto" class="live-lab" id="lb-time">-</span>
  </div>

  <div class="panel" style="padding:12px">
    <div id="tvbox"></div>
  </div>

  <!-- 全市场 15m 涨跌家数统计 + 详细表格 -->
  <div class="panel">
    <div id="updown-panel"></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div class="panel" id="panel-account">
      <h3>💵 盈利监控 · 账户净值/累计盈亏曲线 <small class="muted">真实 OKX 账户 · 10秒实时</small></h3>
      <div class="grid g2" style="gap:10px">
        <div class="stat"><div class="k">账户净值(全币种折USD)</div><div class="v num" id="ov-eq">-</div><div class="s" id="ov-eq-sub">可用 -</div></div>
        <div class="stat"><div class="k">累计已实现盈亏(USDT)</div><div class="v num" id="ov-pnl">-</div><div class="s" id="ov-pnl-sub">按 OKX 成交明细累计</div></div>
      </div>
      <div id="chart-equity" class="chart-box" style="height:190px;margin-top:8px"></div>
      <div class="ov-hold" id="ov-hold"></div>
    </div>
    <div class="panel">
      <h3>📦 持仓监控 <small class="muted">实时 OKX 账户</small></h3>
      <div class="grid g2" style="gap:10px">
        <div class="stat"><div class="k">持仓个数</div><div class="v num" id="ov-pos-n">-</div><div class="s" id="ov-pos-sub">-</div></div>
        <div class="stat"><div class="k">浮动盈亏(USDT)</div><div class="v num" id="ov-upl">-</div><div class="s">按标记价实时计算</div></div>
      </div>
    </div>
  </div>

  <!-- 金字塔模拟交易总览 -->
  <div class="panel" id="flowtrack-panel"></div>

  
</div>
